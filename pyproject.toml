[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeguard-oss"
version = "0.8.0"
description = "Open-source trade journal validation, risk analytics, and data-quality toolkit for traders and trading systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TradeGuard OSS contributors"}]
dependencies = []
[project.urls]
Homepage = "https://github.com/hesam1111111111/tradeguard-oss"
Repository = "https://github.com/hesam1111111111/tradeguard-oss"
Issues = "https://github.com/hesam1111111111/tradeguard-oss/issues"
Changelog = "https://github.com/hesam1111111111/tradeguard-oss/blob/main/CHANGELOG.md"
[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
tradeguard = "tradeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
